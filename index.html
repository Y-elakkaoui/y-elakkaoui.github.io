<!-- Language Section -->
<div class="mt-12 bg-cyber-dark p-6 rounded border border-cyber-border">
    <h3 class="text-white font-mono font-bold mb-4 flex items-center gap-2">
        <i class="fas fa-language text-cyber-cyan"></i> Sprachkenntnisse
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div>
            <div class="flex justify-between text-xs text-gray-400 mb-1 font-mono">
                <span>Deutsch</span>
                <span class="text-cyber-cyan font-bold">Fließend</span>
            </div>
            <div class="w-full bg-cyber-panel h-2 rounded overflow-hidden">
                <div class="bg-cyber-cyan h-full w-[90%]"></div>
            </div>
            <p class="text-[11px] text-gray-500 font-mono mt-1">Verhandlungssicher / Arbeitssprache</p>
        </div>

        <div>
            <div class="flex justify-between text-xs text-gray-400 mb-1 font-mono">
                <span>Englisch</span>
                <span class="text-blue-500 font-bold">Fließend</span>
            </div>
            <div class="w-full bg-cyber-panel h-2 rounded overflow-hidden">
                <div class="bg-blue-500 h-full w-[95%]"></div>
            </div>
            <p class="text-[11px] text-gray-500 font-mono mt-1">Verhandlungssicher</p>
        </div>

        <div>
            <div class="flex justify-between text-xs text-gray-400 mb-1 font-mono">
                <span>Französisch</span>
                <span>Gute Kenntnisse</span>
            </div>
            <div class="w-full bg-cyber-panel h-2 rounded overflow-hidden">
                <div class="bg-cyber-green h-full w-[75%]"></div>
            </div>
            <p class="text-[11px] text-gray-500 font-mono mt-1">Gute Sprachpraxis</p>
        </div>

        <div>
            <div class="flex justify-between text-xs text-gray-400 mb-1 font-mono">
                <span>Arabisch</span>
                <span>Muttersprache</span>
            </div>
            <div class="w-full bg-cyber-panel h-2 rounded overflow-hidden">
                <div class="bg-gray-400 h-full w-full"></div>
            </div>
            <p class="text-[11px] text-gray-500 font-mono mt-1">Erstsprache</p>
        </div>
    </div>
</div>
